# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/igorjs/lockstep"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rand = { version = "0.8", default-features = false }
rand_pcg = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
wasm-bindgen-test = "0.3"
rayon = "1.12"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
overflow-checks = true

# The fuzz harness catches panics, which `panic = "abort"` would turn into a crash, and it keeps
# the overflow checks on so an arithmetic slip is a finding rather than a silent wrap.
[profile.fuzz]
inherits = "release"
panic = "unwind"
lto = false
codegen-units = 16
overflow-checks = true
