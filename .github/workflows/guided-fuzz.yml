# SPDX-License-Identifier: Apache-2.0
name: guided-fuzz
# Coverage-guided libFuzzer runs of every fuzz target. Advisory: the job is continue-on-error and
# never blocks a merge (docs/decisions/0080-guided-fuzzing-is-advisory.md). It runs weekly and on
# demand, not on pull requests, because its runs differ each time.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  guided-fuzz:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.1
      - name: Fuzz every target for two minutes
        run: |
          for target in $(grep -oE '^ +name: "[a-z_]+"' crates/lockstep-fuzz/src/targets.rs | cut -d'"' -f2); do
            just fuzz-guided "$target" 120
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
