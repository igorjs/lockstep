# SPDX-License-Identifier: Apache-2.0
name: determinism
# Pull requests run on Linux, the cheapest runner, unless they touch fixtures, schemas, scripts,
# the justfile, line ending rules or workflows: then macOS and Windows run too, because those are
# what differ by platform. Every push to main runs all three platforms, which is the cross-platform
# proof: the same committed hashes on Linux, macOS and Windows.
# A newer push to a pull request cancels its older run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
on:
  pull_request:
  push:
    branches: [main]
jobs:
  scope:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          full='["ubuntu-latest", "macos-latest", "windows-latest"]'
          if [ "$EVENT" = push ]; then
            echo "matrix=$full" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$HEAD" | grep -Eq '(^|/)(fixtures/|schema|scripts/|justfile$|\.gitattributes$|\.github/workflows/)'; then
            echo "matrix=$full" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
  verify:
    permissions:
      contents: read
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      # A prebuilt, pinned wasm-pack instead of compiling it on every job.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
      - run: just ci
  # Miri runs the integer-heavy core and the fuzz smoke under an interpreter that checks every
  # operation. It is slow and needs the nightly compiler, so it is advisory: it never blocks a
  # merge. See docs/decisions/0041-miri-scope.md.
  miri:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: miri
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      - run: just miri
