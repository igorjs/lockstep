name: determinism
# Pull requests run on Linux, the cheapest runner. Every push to main runs all three platforms,
# which is the cross-platform proof: the same committed hashes on Linux, macOS and Windows.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: extractions/setup-just@v2
      - run: cargo install wasm-pack
      - run: just ci
