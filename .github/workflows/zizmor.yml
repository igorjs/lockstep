# SPDX-License-Identifier: Apache-2.0
name: zizmor
# Static analysis of the workflows themselves (docs/ci.md). Findings fail the job; nothing is
# uploaded to code scanning, so no security-events permission is needed and forks can run it.
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          min-severity: low
