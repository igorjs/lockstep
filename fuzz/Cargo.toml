# SPDX-License-Identifier: Apache-2.0
[package]
name = "lockstep-fuzz-guided"
description = "Coverage-guided libFuzzer wrappers over the lockstep-fuzz targets"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lockstep-fuzz = { path = "../crates/lockstep-fuzz" }

# Outside the main workspace on purpose: it needs the nightly compiler (decision 0080).
[workspace]

[profile.release]
debug = 1
panic = "unwind"
overflow-checks = true

[[bin]]
name = "decode_recording"
path = "fuzz_targets/decode_recording.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_core_save"
