# SPDX-License-Identifier: Apache-2.0
[package]
name = "lockstep-headless"
description = "Command line runner: fixture and verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
lockstep-core = { path = "../lockstep-core" }
capsule = { path = "../../examples/capsule" }
crowd = { path = "../../examples/crowd" }
drone-fleet = { path = "../../examples/drone-fleet" }
sparring = { path = "../../examples/sparring" }
ledger = { path = "../../examples/ledger" }
mars-rovers = { path = "../../examples/mars-rovers" }

[features]
# Run the crowd's path batch on a thread pool. Its fixture hash must not change.
parallel = ["crowd/parallel"]
