# SPDX-License-Identifier: Apache-2.0
[package]
name = "lockstep-combat"
description = "Deterministic real-time combat for lockstep: damage in a fixed order, hit shapes, knockback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
# Hexagonal maps, passed through to lockstep-spatial.
hex = ["lockstep-spatial/hex"]

[dependencies]
lockstep-core = { path = "../lockstep-core" }
lockstep-spatial = { path = "../lockstep-spatial" }
serde = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
