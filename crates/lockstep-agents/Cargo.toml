# SPDX-License-Identifier: Apache-2.0
[package]
name = "lockstep-agents"
description = "Deterministic local awareness for lockstep: sight cones, hearing with wind, memory, and decisions in integers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# Hexagonal maps, passed through to lockstep-spatial.
hex = ["lockstep-spatial/hex", "lockstep-combat/hex"]

[dependencies]
lockstep-combat = { path = "../lockstep-combat", version = "0.1.0" }
lockstep-core = { path = "../lockstep-core", version = "0.1.0" }
lockstep-spatial = { path = "../lockstep-spatial", version = "0.1.0" }
serde = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

# The benchmark prints its timings and compares them with benches/baseline.txt. It is a plain
# program (no harness) so it needs no extra dependencies.
[[bench]]
name = "agents"
harness = false
