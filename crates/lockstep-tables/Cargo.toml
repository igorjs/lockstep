[package]
name = "lockstep-tables"
description = "Data tables for lockstep: named rows read from JSON, checked whole, and swapped at run time by an intent so a recording still replays"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
lockstep-core = { path = "../lockstep-core" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
